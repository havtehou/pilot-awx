---
- name: Create Application Gateway HTTP Settings using Azure CLI
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    resource_group: rg-pilot-test
    gateway_name: agw-pilot-test
    backend_setting_name: backend-https-setting-3
    backend_port: 443
    backend_protocol: Https
    backend_host_name: backend.internal.local

  tasks:
    - name: Login to Azure using Service Principal
      ansible.builtin.shell: |
        az login --service-principal \
          --username "{{ lookup('env', 'AZURE_CLIENT_ID') }}" \
          --password "{{ lookup('env', 'AZURE_SECRET') }}" \
          --tenant "{{ lookup('env', 'AZURE_TENANT') }}"
      register: az_login
      changed_when: false

    - name: Set Azure subscription
      ansible.builtin.shell: |
        az account set --subscription "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
      changed_when: false

    - name: Create backend HTTPS setting
      ansible.builtin.shell: |
        az network application-gateway http-settings create \
          --resource-group {{ resource_group }} \
          --gateway-name {{ gateway_name }} \
          --name {{ backend_setting_name }} \
          --port {{ backend_port }} \
          --protocol {{ backend_protocol }} \
          --host-name {{ backend_host_name }} \
          --timeout 30 \
          --cookie-based-affinity Disabled
      register: backend_setting_result

    - name: Show backend setting result
      ansible.builtin.debug:
        var: backend_setting_result.stdout