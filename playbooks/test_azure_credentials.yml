---
- name: Test Azure credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../.venv/bin/python"
    azure_auth_source: env
    azure_subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') | default(omit) }}"
  tasks:
    - name: Ensure Azure service principal environment variables are set
      ansible.builtin.assert:
        that:
          - lookup('env', 'AZURE_CLIENT_ID') != ''
          - lookup('env', 'AZURE_SECRET') != ''
          - lookup('env', 'AZURE_TENANT') != ''
        fail_msg: |
          Azure service principal variables are missing.
          Source .env before running this playbook, or set AZURE_CLIENT_ID, AZURE_SECRET, AZURE_TENANT, and optionally AZURE_SUBSCRIPTION_ID.

    - name: Validate Azure authentication by fetching subscription info
      azure.azcollection.azure_rm_subscription_info:
        auth_source: "{{ azure_auth_source }}"
        subscription_id: "{{ azure_subscription_id }}"
      register: subscription_info

    - name: Show authenticated subscription details
      debug:
        msg:
          - "Azure credentials are valid."
          - "Subscription ID: {{ subscription_info.subscriptions[0].subscription_id if subscription_info.subscriptions | length > 0 else 'unknown' }}"
          - "Tenant ID: {{ subscription_info.subscriptions[0].tenant_id if subscription_info.subscriptions | length > 0 else 'unknown' }}"
          - "Display Name: {{ subscription_info.subscriptions[0].display_name if subscription_info.subscriptions | length > 0 else 'unknown' }}"
