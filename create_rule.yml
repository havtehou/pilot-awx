---
- name: Create Application Gateway Routing Rule using Azure CLI
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    rresource_group: rg-pilot-test
    gateway_name: agw-pilot-test
    rule_name: test2
    listener_name: test-http-listener-2
    rule_type: Basic
    backend_pool_name: appgw-backend-pool
    http_settings_name: appgw-http-settings
    priority: 2

  tasks:
    - name: Login to Azure using Service Principal
      ansible.builtin.shell: |
        az login --service-principal \
          --username "{{ lookup('env', 'AZURE_CLIENT_ID') }}" \
          --password "{{ lookup('env', 'AZURE_SECRET') }}" \
          --tenant "{{ lookup('env', 'AZURE_TENANT') }}"
      changed_when: false

    - name: Set Azure subscription
      ansible.builtin.shell: |
        az account set --subscription "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
      changed_when: false

    - name: Create Application Gateway Routing Rule
      ansible.builtin.shell: |
        az network application-gateway rule create \
          --resource-group {{ resource_group }} \
          --gateway-name {{ gateway_name }} \
          --name {{ rule_name }} \
          --http-listener {{ listener_name }} \
          --rule-type {{ rule_type }} \
          --address-pool {{ backend_pool_name }} \
          --http-settings {{ http_settings_name }} \
          --priority {{ priority }}
      register: rule_result

    - name: Show result
      ansible.builtin.debug:
        var: rule_result.stdout