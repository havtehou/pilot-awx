---
- name: Create Application Gateway HTTP Listener using Azure CLI
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    resource_group: rg-pilot-test
    gateway_name: agw-pilot-test
    listener_name: test-listener
    frontend_port_name: appgw-http-port
    frontend_ip_name: appgw-frontend-ip-config

  tasks:
    - name: Login to Azure using Service Principal
      ansible.builtin.shell: |
        az login --service-principal \
          --username "{{ lookup('env', 'AZURE_CLIENT_ID') }}" \
          --password "{{ lookup('env', 'AZURE_SECRET') }}" \
          --tenant "{{ lookup('env', 'AZURE_TENANT') }}"
      register: az_login
      changed_when: false

    - name: Set Azure subscription
      ansible.builtin.shell: |
        az account set \
          --subscription "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
      changed_when: false

    - name: Create HTTP Listener
      ansible.builtin.shell: |
        az network application-gateway http-listener create \
          --name {{ listener_name }} \
          --gateway-name {{ gateway_name }} \
          --resource-group {{ resource_group }} \
          --frontend-port {{ frontend_port_name }} \
          --frontend-ip {{ frontend_ip_name }}
      register: listener_result

    - name: Show listener result
      ansible.builtin.debug:
        var: listener_result.stdout