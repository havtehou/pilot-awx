---
- name: Create Application Gateway Listener
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    resource_group: rg-pilot-test
    gateway_name: agw-pilot-test

    listener_name: listener-http-8080
    frontend_ip: Public
    frontend_port: 8080
    protocol: Http

  tasks:
    - name: Azure login
      ansible.builtin.shell: |
        az login --service-principal \
          --username "{{ lookup('env', 'AZURE_CLIENT_ID') }}" \
          --password "{{ lookup('env', 'AZURE_SECRET') }}" \
          --tenant "{{ lookup('env', 'AZURE_TENANT') }}"
      changed_when: false

    - name: Set subscription
      ansible.builtin.shell: |
        az account set --subscription "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
      changed_when: false

    - name: Create frontend port if not exists
      ansible.builtin.shell: |
        az network application-gateway frontend-port create \
          --resource-group {{ resource_group }} \
          --gateway-name {{ gateway_name }} \
          --name port-{{ frontend_port }} \
          --port {{ frontend_port }}
      register: frontend_port_result

    - name: Create listener
      ansible.builtin.shell: |
        az network application-gateway listener create \
          --resource-group {{ resource_group }} \
          --gateway-name {{ gateway_name }} \
          --name {{ listener_name }} \
          --frontend-ip {{ frontend_ip }} \
          --frontend-port port-{{ frontend_port }} \
          --protocol {{ protocol }}
      register: listener_result

    - name: Show listener result
      ansible.builtin.debug:
        var: listener_result.stdout