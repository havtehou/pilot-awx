---
- name: Create Application Gateway Listener using Azure CLI
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    resource_group: rg-pilot-test
    gateway_name: agw-pilot-test

    listener_name: listener-https-01
    frontend_ip_name: appGatewayFrontendIP
    frontend_port_name: port-443
    ssl_cert_name: ssl-cert-01
    host_name: app.internal.local

  tasks:
    - name: Login to Azure using Service Principal
      ansible.builtin.shell: |
        az login --service-principal \
          --username "{{ lookup('env', 'AZURE_CLIENT_ID') }}" \
          --password "{{ lookup('env', 'AZURE_SECRET') }}" \
          --tenant "{{ lookup('env', 'AZURE_TENANT') }}"
      changed_when: false

    - name: Set Azure subscription
      ansible.builtin.shell: |
        az account set --subscription "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
      changed_when: false

    - name: Create HTTPS Listener
      ansible.builtin.shell: |
        az network application-gateway http-listener create \
          --resource-group {{ resource_group }} \
          --gateway-name {{ gateway_name }} \
          --name {{ listener_name }} \
          --frontend-ip {{ frontend_ip_name }} \
          --frontend-port {{ frontend_port_name }} \
          --ssl-cert {{ ssl_cert_name }} \
          --host-name {{ host_name }}
      register: listener_result

    - name: Show listener result
      ansible.builtin.debug:
        var: listener_result.stdout